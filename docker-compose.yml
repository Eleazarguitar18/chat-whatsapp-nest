services:
  whatsapp-bot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-nest:latest
    container_name: chat-whatsapp-nest-app
    restart: always
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./${AUTH_FOLDER_NAME}:/app/${AUTH_FOLDER_NAME}
    env_file:
      - .env